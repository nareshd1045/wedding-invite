<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMuhurtham" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="50%" stop-color="#FFE0B2" />
      <stop offset="100%" stop-color="#FFCC80" />
    </linearGradient>
    <linearGradient id="kanjeevaram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="40%" stop-color="#990000" />
      <stop offset="100%" stop-color="#670000" />
    </linearGradient>
    <linearGradient id="veshtiSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFF0" />
      <stop offset="60%" stop-color="#F5F2DF" />
      <stop offset="100%" stop-color="#EBE3C5" />
    </linearGradient>
    <linearGradient id="goldTemple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B28900" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEE58" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFA726" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFA726" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowMuhurtham" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4E342E" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" rx="20" fill="url(#bgMuhurtham)" />

  <!-- Temple Mandap Arch Backdrop -->
  <path d="M 60 380 L 60 140 Q 250 10 440 140 L 440 380" fill="none" stroke="#D7CCC8" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M 85 380 L 85 160 Q 250 45 415 160 L 415 380" fill="none" stroke="url(#goldTemple)" stroke-width="2" opacity="0.7"/>

  <!-- Banana Tree Plantain Leaf Decor on Edges (Auspicious Tamil Tradition) -->
  <g opacity="0.85">
    <!-- Left Banana Tree -->
    <path d="M 25 380 C 20 280 10 200 5 150 C 25 170 35 220 32 380 Z" fill="#4CAF50"/>
    <path d="M 12 180 C 5 130 35 110 50 120 C 35 140 25 160 12 180 Z" fill="#66BB6A"/>
    <path d="M 20 220 C 40 180 70 190 75 210 C 55 220 35 225 20 220 Z" fill="#81C784"/>

    <!-- Right Banana Tree -->
    <path d="M 475 380 C 480 280 490 200 495 150 C 475 170 465 220 468 380 Z" fill="#4CAF50"/>
    <path d="M 488 180 C 495 130 465 110 450 120 C 465 140 475 160 488 180 Z" fill="#66BB6A"/>
    <path d="M 480 220 C 460 180 430 190 425 210 C 445 220 465 225 480 220 Z" fill="#81C784"/>
  </g>

  <!-- Auspicious Brass Kuthuvilakku (Diya Lamps on sides) -->
  <!-- Left Lamp -->
  <g transform="translate(65, 230)" filter="url(#shadowMuhurtham)">
    <circle cx="15" cy="-5" r="22" fill="url(#lampGlow)"/>
    <path d="M 12 -2 C 10 -15 15 -22 15 -22 C 15 -22 20 -15 18 -2 Z" fill="#FFA000"/>
    <path d="M 13 -4 C 12 -12 15 -16 15 -16 C 15 -16 18 -12 17 -4 Z" fill="#FFF59D"/>
    <!-- Lamp top cup -->
    <path d="M 0 0 C 0 10 30 10 30 0 Z" fill="url(#goldTemple)"/>
    <!-- Pillar -->
    <rect x="12" y="8" width="6" height="75" fill="url(#goldTemple)"/>
    <circle cx="15" cy="40" r="7" fill="url(#goldTemple)"/>
    <!-- Base -->
    <path d="M 2 85 C 5 78 25 78 28 85 L 32 95 L -2 95 Z" fill="url(#goldTemple)"/>
  </g>

  <!-- Right Lamp -->
  <g transform="translate(405, 230)" filter="url(#shadowMuhurtham)">
    <circle cx="15" cy="-5" r="22" fill="url(#lampGlow)"/>
    <path d="M 12 -2 C 10 -15 15 -22 15 -22 C 15 -22 20 -15 18 -2 Z" fill="#FFA000"/>
    <path d="M 13 -4 C 12 -12 15 -16 15 -16 C 15 -16 18 -12 17 -4 Z" fill="#FFF59D"/>
    <!-- Lamp top cup -->
    <path d="M 0 0 C 0 10 30 10 30 0 Z" fill="url(#goldTemple)"/>
    <!-- Pillar -->
    <rect x="12" y="8" width="6" height="75" fill="url(#goldTemple)"/>
    <circle cx="15" cy="40" r="7" fill="url(#goldTemple)"/>
    <!-- Base -->
    <path d="M 2 85 C 5 78 25 78 28 85 L 32 95 L -2 95 Z" fill="url(#goldTemple)"/>
  </g>

  <!-- Sacred Thali (Mangalsutra) Knot Motif in the Center Sky -->
  <g transform="translate(250, 42)" filter="url(#shadowMuhurtham)">
    <!-- Yellow Turmeric Thread -->
    <path d="M -45 -10 Q 0 16 45 -10" fill="none" stroke="#FFD600" stroke-width="3.5"/>
    <!-- Golden Thali Pendant -->
    <path d="M -12 10 L 0 -2 L 12 10 L 0 24 Z" fill="url(#goldTemple)" stroke="#B28900" stroke-width="1"/>
    <circle cx="0" cy="11" r="3" fill="#D32F2F"/>
    <!-- Auspicious 3 Knots (Moondru Mudichu) -->
    <circle cx="-16" cy="6" r="3.5" fill="#FFC107"/>
    <circle cx="0" cy="2" r="3.5" fill="#FFC107"/>
    <circle cx="16" cy="6" r="3.5" fill="#FFC107"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="365" rx="135" ry="16" fill="#8D6E63" opacity="0.25" />

  <!-- ==================== GROOM (Tamil Traditional Veshti & Silk Shirt) ==================== -->
  <g id="tamilGroom" transform="translate(145, 95)">
    <!-- Traditional Pattu Veshti (Silk Dhoti with Gold Zari Border) -->
    <path d="M 32 185 L 26 270 L 86 270 L 80 185 Z" fill="url(#veshtiSilk)" filter="url(#shadowMuhurtham)"/>
    <!-- Gold Zari Border at Bottom of Veshti -->
    <path d="M 26 260 L 86 260 L 86 270 L 26 270 Z" fill="url(#goldTemple)"/>
    <line x1="26" y1="262" x2="86" y2="262" stroke="#B71C1C" stroke-width="1.5"/>
    <path d="M 52 185 L 50 260" stroke="#D7CCC8" stroke-width="1.5"/> <!-- Pleats -->

    <!-- Feet -->
    <ellipse cx="40" cy="272" rx="9" ry="4" fill="#F5D0B5"/>
    <ellipse cx="72" cy="272" rx="9" ry="4" fill="#F5D0B5"/>

    <!-- Silk Shirt / Jubba -->
    <path d="M 28 85 L 32 190 L 82 190 L 86 85 Z" fill="url(#veshtiSilk)" filter="url(#shadowMuhurtham)"/>
    <line x1="57" y1="88" x2="57" y2="190" stroke="url(#goldTemple)" stroke-width="2"/>
    <circle cx="57" cy="115" r="2" fill="url(#goldTemple)"/>
    <circle cx="57" cy="135" r="2" fill="url(#goldTemple)"/>
    <circle cx="57" cy="155" r="2" fill="url(#goldTemple)"/>

    <!-- Traditional Angavastram (Silk Shawl with Gold Zari across shoulder) -->
    <path d="M 32 86 C 45 105 78 170 82 190 L 72 192 C 65 170 40 108 26 90 Z" fill="#FFFDE7"/>
    <path d="M 32 86 C 45 105 78 170 82 190" stroke="url(#goldTemple)" stroke-width="4"/>
    <path d="M 72 185 L 82 185" stroke="#B71C1C" stroke-width="2.5"/>

    <!-- Arms -->
    <path d="M 28 85 Q 15 130 26 155" stroke="#F5D0B5" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 86 85 Q 98 120 108 145" stroke="#F5D0B5" stroke-width="11" stroke-linecap="round" fill="none"/>

    <!-- Wedding Rose Garland (Kalyana Maalai) on Groom -->
    <path d="M 40 85 Q 26 145 56 168 Q 80 145 74 85" fill="none" stroke="#E91E63" stroke-width="10" stroke-linecap="round"/>
    <path d="M 40 85 Q 26 145 56 168 Q 80 145 74 85" fill="none" stroke="#FFF" stroke-width="3" stroke-dasharray="4 6"/>
    <!-- Pendant rose tassel on garland -->
    <circle cx="56" cy="172" r="6" fill="#D81B60"/>
    <circle cx="56" cy="180" r="4" fill="#FFC107"/>

    <!-- Head & Face -->
    <rect x="49" y="70" width="16" height="15" fill="#F5D0B5"/>
    <circle cx="41" cy="52" r="5" fill="#F5D0B5"/>
    <circle cx="73" cy="52" r="5" fill="#F5D0B5"/>
    <ellipse cx="57" cy="52" rx="16" ry="19" fill="#F5D0B5"/>
    
    <!-- Traditional Groom Haircut -->
    <path d="M 41 48 C 41 28 73 28 73 48 C 73 37 65 32 57 32 C 48 32 41 37 41 48 Z" fill="#2E1C14"/>

    <!-- Sacred Sandalwood Tilak & Kumkum (Chandan + Vibhuti + Pottu) -->
    <line x1="51" y1="42" x2="63" y2="42" stroke="#FFF9C4" stroke-width="2"/>
    <line x1="53" y1="45" x2="61" y2="45" stroke="#FFF9C4" stroke-width="2"/>
    <circle cx="57" cy="43.5" r="1.5" fill="#B71C1C"/>

    <!-- Eyes and Eyebrows -->
    <path d="M 46 47 Q 50 45 54 47" stroke="#2E1C14" stroke-width="1.8" fill="none"/>
    <path d="M 60 47 Q 64 45 68 47" stroke="#2E1C14" stroke-width="1.8" fill="none"/>
    <circle cx="50" cy="52" r="2.2" fill="#2E1C14"/>
    <circle cx="64" cy="52" r="2.2" fill="#2E1C14"/>
    <circle cx="51" cy="51" r="0.7" fill="#FFFFFF"/>
    <circle cx="65" cy="51" r="0.7" fill="#FFFFFF"/>

    <!-- Warm Smiling Groom Face -->
    <path d="M 52 59 Q 57 65 62 59" fill="none" stroke="#8D6E63" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 51 56 Q 57 58 63 56" fill="none" stroke="#3E2723" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- ==================== BRIDE (Traditional Kanjeevaram Silk Saree) ==================== -->
  <g id="tamilBride" transform="translate(245, 95)">
    <!-- Silk Saree Draped Skirt & Pleats (Kozhundhu) -->
    <path d="M 46 100 L 15 270 L 125 270 L 98 100 Z" fill="url(#kanjeevaram)" filter="url(#shadowMuhurtham)"/>
    
    <!-- Rich Gold Zari Border on Silk Saree Hem -->
    <path d="M 15 258 L 125 258 L 125 270 L 15 270 Z" fill="url(#goldTemple)"/>
    <!-- Traditional Temple Zari Triangle Motifs (Moggu) on Saree -->
    <g fill="#FFE082">
      <polygon points="25,258 30,250 35,258"/>
      <polygon points="45,258 50,250 55,258"/>
      <polygon points="65,258 70,250 75,258"/>
      <polygon points="85,258 90,250 95,258"/>
      <polygon points="105,258 110,250 115,258"/>
    </g>

    <!-- Saree Vertical Pleats (Kosuvan) -->
    <path d="M 64 105 L 62 258" stroke="url(#goldTemple)" stroke-width="2"/>
    <path d="M 72 105 L 72 258" stroke="url(#goldTemple)" stroke-width="1.5"/>
    <path d="M 80 105 L 82 258" stroke="url(#goldTemple)" stroke-width="1.5"/>

    <!-- Feet with Metthi (Toe ring) / Alta / Mehendi -->
    <ellipse cx="50" cy="272" rx="9" ry="4" fill="#F5D0B5"/>
    <ellipse cx="86" cy="272" rx="9" ry="4" fill="#F5D0B5"/>
    <circle cx="50" cy="272" r="1.5" fill="#D32F2F"/>
    <circle cx="86" cy="272" r="1.5" fill="#D32F2F"/>

    <!-- Blouse (Matching Silk Blouse with Gold Zari Sleeve Borders) -->
    <path d="M 48 76 L 44 102 C 66 106 82 106 98 102 L 94 76 Z" fill="#670000"/>
    <line x1="44" y1="100" x2="98" y2="100" stroke="url(#goldTemple)" stroke-width="3"/>

    <!-- Pallu / Mundhani Draped Across Chest -->
    <path d="M 94 82 C 78 105 48 145 42 180 C 48 185 58 178 72 135 C 85 98 94 82 94 82 Z" fill="url(#kanjeevaram)"/>
    <path d="M 94 82 C 78 105 48 145 42 180" stroke="url(#goldTemple)" stroke-width="4.5"/>

    <!-- Gold Waist Belt (Oddiyanam) -->
    <path d="M 45 102 Q 72 110 98 102" fill="none" stroke="url(#goldTemple)" stroke-width="4.5"/>
    <circle cx="72" cy="107" r="3.5" fill="#D32F2F"/>

    <!-- Arms with Red & Green Glass Bangles + Gold Valayal -->
    <path d="M 44 80 Q 30 110 38 140" stroke="#F5D0B5" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 96 80 Q 108 110 98 140" stroke="#F5D0B5" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Bangles stack -->
    <g stroke-width="2.5" fill="none">
      <circle cx="37" cy="132" r="5" stroke="#D4AF37"/>
      <circle cx="37" cy="135" r="5" stroke="#B71C1C"/>
      <circle cx="37" cy="138" r="5" stroke="#2E7D32"/>

      <circle cx="98" cy="132" r="5" stroke="#D4AF37"/>
      <circle cx="98" cy="135" r="5" stroke="#B71C1C"/>
      <circle cx="98" cy="138" r="5" stroke="#2E7D32"/>
    </g>

    <!-- Wedding Rose Garland (Kalyana Maalai) on Bride -->
    <path d="M 52 82 Q 38 145 68 168 Q 92 145 86 82" fill="none" stroke="#E91E63" stroke-width="9" stroke-linecap="round"/>
    <path d="M 52 82 Q 38 145 68 168 Q 92 145 86 82" fill="none" stroke="#FFF" stroke-width="2.5" stroke-dasharray="3 5"/>
    <circle cx="68" cy="172" r="5.5" fill="#D81B60"/>
    <circle cx="68" cy="179" r="3.5" fill="#FFC107"/>

    <!-- Long Plait with Fresh Jasmine Flowers (Mallipoo Veni) -->
    <g transform="translate(18, 10)">
      <circle cx="86" cy="42" r="14" fill="#FFFFFF"/>
      <circle cx="88" cy="42" r="11" fill="#FFF59D"/>
      <!-- Floral Jasmine String cascading down side -->
      <circle cx="88" cy="62" r="5" fill="#FFFFFF"/>
      <circle cx="89" cy="74" r="5" fill="#FFFFFF"/>
      <circle cx="90" cy="86" r="5" fill="#FFFFFF"/>
      <circle cx="90" cy="98" r="5" fill="#FFFFFF"/>
      <circle cx="89" cy="110" r="5" fill="#FFFFFF"/>
      <circle cx="88" cy="122" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Neck & Traditional Temple Gold Jewelry (Kasumalai & Mango Malai) -->
    <rect x="64" y="65" width="14" height="15" fill="#F5D0B5"/>
    <!-- Choker -->
    <path d="M 62 72 Q 71 78 80 72" fill="none" stroke="url(#goldTemple)" stroke-width="3"/>
    <!-- Kasumalai (Coin Necklace) -->
    <path d="M 58 77 Q 71 88 84 77" fill="none" stroke="url(#goldTemple)" stroke-width="4"/>
    <circle cx="71" cy="85" r="2.5" fill="#D32F2F"/>

    <!-- Head & Face -->
    <circle cx="55" cy="50" r="4.5" fill="#F5D0B5"/>
    <circle cx="87" cy="50" r="4.5" fill="#F5D0B5"/>
    <!-- Traditional Jhumkas (Jimikki) -->
    <g fill="url(#goldTemple)">
      <circle cx="54" cy="55" r="2"/>
      <path d="M 51 58 L 57 58 L 54 65 Z"/>
      <circle cx="88" cy="55" r="2"/>
      <path d="M 85 58 L 91 58 L 88 65 Z"/>
    </g>
    
    <ellipse cx="71" cy="50" rx="15" ry="17" fill="#F5D0B5"/>

    <!-- Front Center-Parted Hair with Nethi Chutti & Suryan-Chandran -->
    <path d="M 56 42 C 61 30 81 30 86 42 C 80 37 74 36 71 39 C 68 36 62 37 56 42 Z" fill="#1F120C"/>
    
    <!-- Nethi Chutti (Traditional Tamil Bridal Forehead Ornament) -->
    <line x1="71" y1="32" x2="71" y2="44" stroke="url(#goldTemple)" stroke-width="1.8"/>
    <path d="M 62 39 Q 71 43 80 39" fill="none" stroke="url(#goldTemple)" stroke-width="1.2"/>
    <circle cx="71" cy="44" r="2.8" fill="url(#goldTemple)"/>
    <circle cx="71" cy="44" r="1.3" fill="#D32F2F"/>

    <!-- Auspicious Bridal Red Pottu / Kumkum Bindi -->
    <circle cx="71" cy="47" r="1.6" fill="#B71C1C"/>

    <!-- Brows & Eyes with Kohl -->
    <path d="M 61 45 Q 65 43 68 45" stroke="#1F120C" stroke-width="1.4" fill="none"/>
    <path d="M 74 45 Q 77 43 81 45" stroke="#1F120C" stroke-width="1.4" fill="none"/>
    <path d="M 62 49 Q 65 53 68 49" stroke="#1F120C" stroke-width="2" fill="none"/>
    <path d="M 74 49 Q 77 53 80 49" stroke="#1F120C" stroke-width="2" fill="none"/>
    <circle cx="65" cy="49" r="1" fill="#1F120C"/>
    <circle cx="77" cy="49" r="1" fill="#1F120C"/>

    <!-- Mookuthi (Tiny Gold Nose Pin) -->
    <circle cx="68" cy="53" r="0.9" fill="#FFD700"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="61" cy="55" rx="3.5" ry="2" fill="#FF8A80" opacity="0.6"/>
    <ellipse cx="81" cy="55" rx="3.5" ry="2" fill="#FF8A80" opacity="0.6"/>

    <!-- Gentle Bridal Smile -->
    <path d="M 67 58 Q 71 63 75 58" fill="none" stroke="#C2185B" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Golden Rays / Divine Blessings -->
  <g stroke="url(#goldTemple)" stroke-width="1" opacity="0.4">
    <line x1="250" y1="20" x2="220" y2="70"/>
    <line x1="250" y1="20" x2="280" y2="70"/>
    <line x1="250" y1="20" x2="190" y2="60"/>
    <line x1="250" y1="20" x2="310" y2="60"/>
  </g>

  <!-- Event Title Ribbon / Tag inside Art -->
  <g transform="translate(130, 345)">
    <rect x="0" y="0" width="240" height="32" rx="16" fill="#800020" filter="url(#shadowMuhurtham)" />
    <rect x="2" y="2" width="236" height="28" rx="14" fill="none" stroke="url(#goldTemple)" stroke-width="1.5" />
    <text x="120" y="20" font-family="'Cinzel', 'Playfair Display', serif" font-size="12" font-weight="bold" fill="#FFF8E7" text-anchor="middle" letter-spacing="2">MUHURTHAM CEREMONY</text>
  </g>
</svg>

